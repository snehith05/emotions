<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Companion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4EBFF"/>
      <stop offset="1" stop-color="#B7C7FB"/>
    </linearGradient>
    <radialGradient id="face" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FFEBB0"/>
      <stop offset="1" stop-color="#FFC53D"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B98F7"/>
      <stop offset="1" stop-color="#5873E8"/>
    </linearGradient>
    <clipPath id="round"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <circle cx="64" cy="60" r="46" fill="#FFFFFF" opacity="0.22"/>

    <!-- body -->
    <path d="M20 128 C24 106 42 96 64 96 C86 96 104 106 108 128 Z" fill="url(#body)"/>
    <path d="M50 97 Q64 106 78 97" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.55"/>
    <!-- a small heart on the chest -->
    <path d="M64 117 C58 112.5 55.5 109.5 57.6 107 C59.4 105 62.4 105.6 64 108 C65.6 105.6 68.6 105 70.4 107 C72.5 109.5 70 112.5 64 117 Z" fill="#FF7FA8"/>

    <!-- antenna -->
    <path d="M64 28 L64 17" stroke="#5B6A96" stroke-width="3" stroke-linecap="round"/>
    <circle cx="64" cy="13" r="5.5" fill="#FF7FA8"/>
    <circle cx="62.3" cy="11.3" r="1.6" fill="#FFFFFF" opacity="0.8"/>

    <!-- head -->
    <rect x="27" y="26" width="74" height="68" rx="31" fill="url(#face)"/>
    <ellipse cx="48" cy="38" rx="11" ry="5" fill="#FFFFFF" opacity="0.35" transform="rotate(-20 48 38)"/>

    <!-- eyes -->
    <ellipse cx="51" cy="59" rx="6.2" ry="8.2" fill="#2B2D42"/>
    <ellipse cx="77" cy="59" rx="6.2" ry="8.2" fill="#2B2D42"/>
    <circle cx="53.2" cy="55.6" r="2.4" fill="#FFFFFF"/>
    <circle cx="79.2" cy="55.6" r="2.4" fill="#FFFFFF"/>
    <circle cx="49.4" cy="62.4" r="1.1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="75.4" cy="62.4" r="1.1" fill="#FFFFFF" opacity="0.7"/>

    <!-- cheeks and smile -->
    <ellipse cx="41" cy="72" rx="6" ry="3.6" fill="#FF8FA3" opacity="0.55"/>
    <ellipse cx="87" cy="72" rx="6" ry="3.6" fill="#FF8FA3" opacity="0.55"/>
    <path d="M55.5 73.5 Q64 81.5 72.5 73.5" fill="none" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
